# 波动率挤压突破：布林带宽 120 日低分位(＜20%) ≥10 天后收盘破挤压期高点
name: vol_squeeze_breakout
detector:
  type: vol_squeeze_breakout
  params:
    squeeze_pct: 20.0
    min_squeeze: 10
min_data_days: 200
enrich:
  - rel_ret_120d
contract:
  date: break_date
  price: base_price
sort:
  by: break_date
  ascending: false
output: catch_vol_squeeze_breakout.csv

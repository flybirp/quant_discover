# zfzs 金叉波段内回踩（三区口径 + 启动确认过滤）
# 入场：金叉前 10 日内须有 实体>=3% 阳线 且 量>=2x 前20日均量（不含当日）
# 回踩区：[zs*(1-3%), zf*(1+3%)]，须自上方跌入；zone = zf / mid / zs / merged
name: pullback_zone
detector:
  type: pullback_zone
  params:
    band_pct: 3.0
    max_pullbacks: 3
    min_gap_pct: 1.0
    pre_lookback: 10
    min_body_pct: 3.0
    vol_ratio: 2.0
min_data_days: 200
contract:
  date: pullback_date
  price: base_price
sort:
  by: pullback_date
  ascending: false
output: catch_pullback_zone.csv

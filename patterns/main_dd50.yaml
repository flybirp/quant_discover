# 主升浪（回撤状态机）：回撤 <= 50%、>= 50 天、涨幅 >= 50%
name: main_dd50
detector:
  type: main_dd
  params:
    max_drawdown_pct: 50.0
    min_days: 50
    min_return_pct: 50.0
min_data_days: 50           # 旧版 load_data(f, min_days)
contract:
  date: start_date
  price: wave_start_close
sort:
  by: return_pct
  ascending: false
output: catch_main_dd50.csv

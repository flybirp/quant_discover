# 主升浪（趋势线，zhixing_slow）：不连续 2 日跌破、涨幅 > 100%、> 200 天
name: main_trendline_zhixing_slow
detector:
  type: main_trendline
  params:
    indicator: zhixing_slow
min_data_days: 314          # 旧版 min_days_tl(114) + 200
contract:
  date: start_date
  price: start_close
sort:
  by: return_pct
  ascending: false
output: catch_main_trendline_zhixing_slow.csv

# 启动确认 + 前期状态 的敏感性网格：一次扫描标记全部格子
# 网格1 = 启动确认 实体 {1,3,5}% × 量比 {1.5,2,3,4}×  → pass_b{X*10}_v{Y*10}
# 网格2 = 前期状态 纠缠 {60,70,80}% × 斜率 {0.05,0.10,0.15}%/日 × 量能CV {0.6,0.8,1.0}
#         → hf_e{E}_s{S*100}_c{C*10}
# 本配置关闭 require_breakout，收录全部波段（= 网格分析的全体样本）
name: pullback_zone_grid
detector:
  type: pullback_zone
  params:
    band_pct: 3.0
    max_pullbacks: 3
    min_gap_pct: 1.0
    pre_lookback: 10
    require_breakout: false
    grid_bodies:
    - 1.0
    - 3.0
    - 5.0
    grid_volrs:
    - 1.5
    - 2.0
    - 3.0
    - 4.0
    grid_ent:
    - 60.0
    - 70.0
    - 80.0
    grid_slope:
    - 0.05
    - 0.1
    - 0.15
    grid_cv:
    - 0.6
    - 0.8
    - 1.0
min_data_days: 200
contract:
  date: pullback_date
  price: base_price
sort:
  by: pullback_date
  ascending: false
output: catch_pullback_zone_grid.csv

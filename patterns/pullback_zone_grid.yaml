# 启动确认参数的敏感性网格：一次扫描标记全部格子，避免逐格重跑全市场
# 网格 = 实体涨幅 {1,3,5}% × 量比 {1.5,2,3,4}×前20日均量（不含当日）
# 输出列 pass_b{X*10}_v{Y*10}：该回踩所属金叉波段是否通过此格联合判定
# 本配置关闭 require_breakout，收录全部波段（= 网格分析的全体样本）
name: pullback_zone_grid
detector:
  type: pullback_zone
  params:
    band_pct: 3.0
    max_pullbacks: 3
    min_gap_pct: 1.0
    pre_lookback: 10
    require_breakout: false
    grid_bodies:
    - 1.0
    - 3.0
    - 5.0
    grid_volrs:
    - 1.5
    - 2.0
    - 3.0
    - 4.0
min_data_days: 200
contract:
  date: pullback_date
  price: base_price
sort:
  by: pullback_date
  ascending: false
output: catch_pullback_zone_grid.csv
